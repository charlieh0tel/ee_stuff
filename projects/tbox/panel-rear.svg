<svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -18 330 122" width="990" height="366">
  <title>TBox rear panel — 300 x 79 mm, to scale, VIEWED FROM REAR (CH A on right)</title>
  <style>
    .panel  { fill: #ececec; stroke: #222; stroke-width: 1; }
    .grp    { fill: none; stroke: #888; stroke-width: 0.5; }
    .gt     { font-size: 4.5px; font-weight: bold; text-anchor: middle; fill: #333; }
    .gtbg   { fill: #ececec; }
    .nut    { fill: #cfcfcf; stroke: #444; stroke-width: 0.5; }
    .bush   { fill: #e5e5e5; stroke: #444; stroke-width: 0.4; }
    .hole   { fill: #222; }
    .de9    { fill: #d5d5d5; stroke: #333; stroke-width: 0.6; }
    .pin    { fill: #666; }
    .ppP    { fill: #c0392b; stroke: #333; stroke-width: 0.5; }
    .ppN    { fill: #3a3a3a; stroke: #333; stroke-width: 0.5; }
    .trim   { fill: #dedede; stroke: #444; stroke-width: 0.5; }
    .slot   { fill: #555; }
    .bat    { fill: #777; stroke: #333; stroke-width: 0.4; }
    text    { font-family: sans-serif; fill: #222; }
    .lbl    { font-size: 4px; text-anchor: middle; }
    .pos    { font-size: 3.2px; text-anchor: middle; fill: #444; }
    .dim    { font-size: 4px; fill: #777; }
    .dimln  { stroke: #999; stroke-width: 0.3; }
    .wht    { font-size: 6px; font-weight: bold; text-anchor: middle; fill: #fff; }
  </style>

  <defs>
    <!-- 1/4" jack: hex nut + bushing + hole -->
    <g id="j14">
      <polygon class="nut" points="9.5,0 4.75,8.23 -4.75,8.23 -9.5,0 -4.75,-8.23 4.75,-8.23"/>
      <circle class="bush" r="6.5"/>
      <circle class="hole" r="3.2"/>
    </g>
    <!-- 3.5mm jack -->
    <g id="j35">
      <polygon class="nut" points="6,0 3,5.2 -3,5.2 -6,0 -3,-5.2 3,-5.2"/>
      <circle class="bush" r="4"/>
      <circle class="hole" r="1.8"/>
    </g>
    <!-- screwdriver trim -->
    <g id="trim">
      <circle class="trim" r="4.2"/>
      <rect class="slot" x="-3" y="-0.9" width="6" height="1.8" rx="0.5"/>
    </g>
    <!-- toggle, bat up -->
    <g id="tog">
      <polygon class="nut" points="5,0 2.5,4.33 -2.5,4.33 -5,0 -2.5,-4.33 2.5,-4.33"/>
      <circle class="bush" r="3.2"/>
      <rect class="bat" x="-1.4" y="-9" width="2.8" height="9" rx="1.4"/>
    </g>
  </defs>

  <!-- panel outline -->
  <rect class="panel" x="0" y="0" width="300" height="79" rx="2"/>
  <line class="dimln" x1="0" y1="-13" x2="300" y2="-13"/>
  <text class="dim" x="140" y="-15">300 mm</text>
  <line class="dimln" x1="-8" y1="0" x2="-8" y2="79"/>
  <text class="dim" x="-11" y="48" transform="rotate(-90 -11 48)">79 mm</text>
  <text class="dim" x="40" y="92">VIEWED FROM REAR — CH A on right, CH B on left.  Rear board horizontal, top surface 26 mm above the floor (dashed);</text>
  <text class="dim" x="40" y="98">every part is right-angle at the board edge, at its own centre height. Powerpole (pigtail to the control board) and GND post are panel-mount.</text>
  <line class="dimln" x1="0" y1="53" x2="300" y2="53" stroke-dasharray="3 2"/>
  <text class="dim" x="2" y="57.5">board</text>
  <rect class="grp" x="4" y="10" width="66" height="62" rx="2"/>
  <rect class="gtbg" x="17.0" y="7.5" width="40" height="5"/>
  <text class="gt" x="37.0" y="12">CHANNEL B</text>
  <use href="#j14" x="16" y="41"/>  <text class="lbl" x="16" y="27">PTT 1/4"</text>
  <use href="#j35" x="35" y="47"/>  <text class="lbl" x="35" y="33">PTT 3.5</text>
  <text class="lbl" x="49" y="27">BIAS</text>
  <use href="#tog" x="49" y="46"/>
  <text class="pos" x="49" y="36">ON</text>
  <text class="pos" x="49" y="55">OFF</text>
  <text class="lbl" x="62" y="27">GAIN</text>
  <use href="#tog" x="62" y="46"/>
  <text class="pos" x="62" y="36">HI</text>
  <text class="pos" x="62" y="55">LO</text>
  <rect class="grp" x="74" y="10" width="116" height="62" rx="2"/>
  <rect class="gtbg" x="122.0" y="7.5" width="20" height="5"/>
  <text class="gt" x="132.0" y="12">RIG</text>
  <g transform="translate(96,46)">
    <rect class="de9" x="-16" y="-8" width="32" height="16" rx="3"/>
    <path d="M -12,-5 L 12,-5 L 10,5 L -10,5 Z" fill="#aaa" stroke="#555" stroke-width="0.4"/>
    <circle class="pin" cx="-8" cy="-2" r="0.9"/><circle class="pin" cx="-4" cy="-2" r="0.9"/><circle class="pin" cx="0" cy="-2" r="0.9"/><circle class="pin" cx="4" cy="-2" r="0.9"/><circle class="pin" cx="8" cy="-2" r="0.9"/>
    <circle class="pin" cx="-6" cy="2.2" r="0.9"/><circle class="pin" cx="-2" cy="2.2" r="0.9"/><circle class="pin" cx="2" cy="2.2" r="0.9"/><circle class="pin" cx="6" cy="2.2" r="0.9"/>
    <circle class="hole" cx="-20" cy="0" r="1.6"/><circle class="hole" cx="20" cy="0" r="1.6"/>
  </g>
  <text class="lbl" x="96" y="27">RIG  DE-9</text>
  <use href="#j35" x="126" y="47"/>  <text class="lbl" x="126" y="27">LINE OUT</text>
  <use href="#trim" x="139" y="48"/>  <text class="lbl" x="139" y="33">RX L</text>
  <use href="#trim" x="150" y="48"/>  <text class="lbl" x="150" y="27">RX R</text>
  <use href="#trim" x="161" y="48"/>  <text class="lbl" x="161" y="33">MIC</text>
  <use href="#trim" x="172" y="48"/>  <text class="lbl" x="172" y="27">LINE L</text>
  <use href="#trim" x="183" y="48"/>  <text class="lbl" x="183" y="33">LINE R</text>
  <rect class="grp" x="194" y="10" width="32" height="62" rx="2"/>
  <rect class="gtbg" x="197.0" y="7.5" width="26" height="5"/>
  <text class="gt" x="210.0" y="12">POWER</text>
  <g transform="translate(210,46)">
    <rect class="ppP" x="-14" y="-7" width="14" height="14" rx="1.5"/>
    <rect class="ppN" x="0" y="-7" width="14" height="14" rx="1.5"/>
    <text class="wht" x="-7" y="2.2">+</text><text class="wht" x="7" y="2.2">−</text>
  </g>
  <text class="lbl" x="210" y="27">13.8 V</text>
  <g transform="translate(210,63)"><circle class="nut" r="4.5"/><circle class="bush" r="2.8"/><circle class="hole" r="1.3"/></g>
  <text class="lbl" x="210" y="71.5">GND</text>
  <rect class="grp" x="230" y="10" width="66" height="62" rx="2"/>
  <rect class="gtbg" x="243.0" y="7.5" width="40" height="5"/>
  <text class="gt" x="263.0" y="12">CHANNEL A</text>
  <text class="lbl" x="238" y="27">GAIN</text>
  <use href="#tog" x="238" y="46"/>
  <text class="pos" x="238" y="36">HI</text>
  <text class="pos" x="238" y="55">LO</text>
  <text class="lbl" x="251" y="27">BIAS</text>
  <use href="#tog" x="251" y="46"/>
  <text class="pos" x="251" y="36">ON</text>
  <text class="pos" x="251" y="55">OFF</text>
  <use href="#j35" x="265" y="47"/>  <text class="lbl" x="265" y="33">PTT 3.5</text>
  <use href="#j14" x="284" y="41"/>  <text class="lbl" x="284" y="27">PTT 1/4"</text>
</svg>
