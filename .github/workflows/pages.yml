name: Build PDFs and Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # The figure scripts run via `#!/usr/bin/env -S uv run --script` and
      # declare their own deps in a PEP 723 header, so uv is all that is
      # needed -- no pip install of matplotlib/numpy here.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0

      # apt-get update first: without it this installs against the index baked
      # into the runner image, and the moment Ubuntu publishes a new package
      # the old .deb is gone from the mirror and the stale index 404s. That is
      # what broke this workflow on 2026-09-22, on ghostscript.
      - name: Install TeX Live
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-full

      # `make` builds regimes_figure.pdf and regimes_figure_newsletter.pdf
      # itself, as prerequisites of the documents that embed them.
      - name: Build PDFs
        run: make
        working-directory: math/diode_small_signal

      - name: Assemble site
        run: |
          mkdir -p _site/math/diode_small_signal
          cp math/diode_small_signal/diode_smallsignal.pdf _site/math/diode_small_signal/
          cp math/diode_small_signal/diode_reactive.pdf _site/math/diode_small_signal/
          cp math/diode_small_signal/diode_not_squarelaw_newsletter.pdf _site/math/diode_small_signal/
          cat > _site/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head><meta charset="utf-8"><title>EE Notes</title>
          <style>body{font-family:sans-serif;max-width:600px;margin:2em auto}</style>
          </head>
          <body>
          <h1>EE Notes</h1>
          <ul>
            <li><a href="math/diode_small_signal/diode_smallsignal.pdf">Diode Small Signal Model Derivation</a></li>
            <li><a href="math/diode_small_signal/diode_reactive.pdf">Reactive Small-Signal: Nonlinear Junction Capacitance</a></li>
            <li><a href="math/diode_small_signal/diode_not_squarelaw_newsletter.pdf">A Diode Is Not a Square-Law Device</a></li>
          </ul>
          </body>
          </html>
          EOF

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5
